<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Graph Code Builder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="toolbar">
        <div class="tool-group">
            <strong>Tools:</strong>
            <button id="mode-point" class="active" onclick="setMode('point')" title="Click the canvas to add a coordinate point">Point</button>
            <button id="mode-line" onclick="setMode('line')" title="Click two points to connect them with a straight line">Line</button>
            <button id="mode-circle" onclick="setMode('circle')" title="Click a center point, then click a point on the circumference">Circle</button>
            <button id="mode-arc" onclick="setMode('arc')" title="Click 1 point to set the center of the arc">Circular Arc</button>
            <button id="mode-elliptic-arc" onclick="setMode('elliptic-arc')" title="Click 2 points to set the foci of the ellipse">Elliptic Arc</button>
            <button id="mode-text" onclick="setMode('text')" title="Click anywhere to add free-floating text or LaTeX math">Free Text</button>
            <div class="divider"></div>
            <button id="mode-select" onclick="setMode('select')" title="Select an item to edit its properties">Select (Arrow)</button>
            <button id="mode-move" onclick="setMode('move')" title="Click and drag points or text to move them">Move</button>
            <button id="mode-delete" onclick="setMode('delete')" title="Click any item to erase it">Eraser</button>
        </div>
        
        <div class="tool-group" style="background: #eef2f5; border-radius: 4px; padding: 4px 10px; border: 1px solid #ccd6e0;">
            <strong style="color: #0056b3;">Macros:</strong>
            <select id="macro-type" onchange="toggleMacroInputs()" title="Select standard graph shape">
                <option value="Kn">Complete (Kn)</option>
                <option value="Cn">Cycle (Cn)</option>
                <option value="Star">Star (K1,n)</option>
                <option value="Pn">Path (Pn)</option>
                <option value="Km,n">Bipartite (Km,n)</option>
            </select>
            <input type="number" id="macro-n" value="5" min="1" max="50" style="width: 45px;" title="Nodes (n)">
            <input type="number" id="macro-m" value="3" min="1" max="50" style="width: 45px; display: none;" title="Left Partition (m)">
            <button onclick="insertMacro()" style="background: #28a745; color: white; border-color: #218838; font-weight: bold;" title="Instantly draw this graph">Insert</button>
        </div>

        <div class="tool-group properties-panel">
            <strong>Properties:</strong>
            <input type="text" id="prop-label" placeholder="Label..." disabled style="width: 70px;" title="Text Label or Equation">
            <input type="number" id="prop-label-angle" disabled title="Angle of the point label (0 to 360 degrees)" style="width: 50px; display: none;" placeholder="Ang°">
            
            <select id="prop-label-pos" disabled title="Position of the label relative to the line" style="display: none;">
                <option value="above">Above</option>
                <option value="below">Below</option>
                <option value="sloped">Sloped</option>
            </select>
            
            <input type="number" id="prop-radius" disabled title="Radius or Semi-Major Axis" style="width: 55px; display: none;" placeholder="Radius">
            <input type="number" id="prop-angle-start" disabled title="Starting Angle (Degrees)" style="width: 55px; display: none;" placeholder="Start°">
            <input type="number" id="prop-angle-end" disabled title="Ending Angle (Degrees)" style="width: 55px; display: none;" placeholder="End°">

            <div class="divider"></div>
            
            <select id="prop-arrow" disabled title="Add directional arrows to lines">
                <option value="none">No Arrow</option>
                <option value="end">End -></option>
                <option value="start">Start <-</option>
                <option value="both">Both <-></option>
            </select>
            
            <div class="custom-select" id="color-picker" title="Change item color">
                <div class="select-selected" id="current-color">
                    <span class="color-box" style="background: Black;"></span> Black
                </div>
                <div class="select-items select-hide" id="color-list"></div>
            </div>
            
            <select id="point-style" title="Change point style">
                <option value="solid">Solid Dot</option>
                <option value="none">Hollow Dot</option>
            </select>
            <select id="line-style" title="Change line style">
                <option value="solid">Solid Line</option>
                <option value="dashed">Dashed Line</option>
                <option value="dotted">Dotted Line</option>
            </select>

            <button id="prop-delete-btn" class="danger" disabled onclick="deleteSelected()" title="Delete selected item" style="margin-left: 5px;">🗑️</button>
        </div>

        <div class="tool-group">
            <button onclick="zoomIn()" title="Zoom in (+)">Zoom +</button>
            <button onclick="zoomOut()" title="Zoom out (-)">Zoom -</button>
            <label title="Show or hide the background grid"><input type="checkbox" id="toggle-grid" checked onchange="draw()"> Grid</label>
            <label title="Snap points exactly to grid intersections"><input type="checkbox" id="snap-grid" checked> Snap</label>
            
            <div class="divider"></div>
            <button onclick="toggleLayout()" title="Switch layout for mobile devices" style="font-weight: bold; background: #343a40; color: white;">↕️ Layout</button>
            
            <button onclick="clearAll()" class="danger" title="Clear entire canvas" style="margin-left: 5px;">Clear</button>
        </div>
    </div>
    
    <div id="workspace">
        <div id="left-panel">
            <div id="canvas-container">
                <canvas id="graphCanvas" title="Graph Drawing Area"></canvas>
            </div>
        </div>
        
        <div id="resizer" title="Drag to resize panels"></div>
        
        <div id="right-panel">
            <div class="output-header">
                <h3>Generated Code:</h3>
                <div>
                    <button onclick="exportJSON()" title="Download graph as JSON to save your work">Save JSON</button>
                    <button onclick="document.getElementById('file-import').click()" title="Load a previously saved JSON graph">Load JSON</button>
                    <input type="file" id="file-import" style="display: none;" accept=".json" onchange="importJSON(event)">
                    <select id="code-format" onchange="draw()" title="Choose output LaTeX format">
                        <option value="pstricks">PSTricks</option>
                        <option value="tikz">TikZ</option>
                    </select>
                </div>
            </div>
            <textarea id="codeOutput" readonly title="Copy this code into your LaTeX document"></textarea>
            <p style="font-size: 11px; color: #666; margin-top: 5px;">* Select any item and press <b>Delete</b> on your keyboard to remove it.</p>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/generators.js"></script>
    <script src="js/canvas.js"></script>
</body>
</html>
